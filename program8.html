<html>
<head>
    <title>REGISTRATION FORM</title>
  <style>
        body {
    font-family: Arial;
    background: lightblue;
}

h2 {
    text-align: center;
    color: darkblue;
}
form {
    background: white;
    width: 350px;
    margin: auto;
    padding: 25px;
    border-radius: 10px;
}

label {
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 10px;
    background: darkblue;
    color: white;
}

button:hover {
    background: blue;
}
    </style>
</head>
<body>
<h2>REGISTRATION FORM</h2>
<form name="f1" onsubmit="return validateForm()">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email"><br><br>
    <label for="phone">Phone No:</label>
    <input type="tel" id="phone" name="phone"><br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password"><br><br>
    <label for="confpassword">Confirm Password:</label>
    <input type="password" id="confpassword" name="confpassword"><br><br>
    <label for="gender">Gender:</label>
    <select id="gender" name="gender">
        <option value="">Select Gender</option>
        <option value="male">MALE</option>
        <option value="female">FEMALE</option>
        <option value="other">OTHERS</option>
    </select><br><br>
    <button type="submit">REGISTER</button>
</form>
<script>
function validateForm()
{
    var name = document.f1.name.value;
    var email = document.f1.email.value;
    var phone = document.f1.phone.value;
    var password = document.f1.password.value;
    var confpassword = document.f1.confpassword.value;
    var gender = document.f1.gender.value;
    if(name.trim() == "")
    {
        alert("Name can't be blank");
        return false;
    }
    var at = email.indexOf("@");
    var dot = email.indexOf(".");
    if(email == "")
    {
     alert("Email field is empty");
     return false;
    }
   else if(at < 1 || dot < at + 2 || dot + 2 >= email.length)
  {
    alert("Enter valid email");
    return false;
  }
    if(phone.length != 10 || isNaN(phone))
    {
        alert("Enter valid 10 digit phone number");
        return false;
    }
    if(password.length < 8)
    {
        alert("Password must be at least 8 characters");
        return false;
    }
    if(password != confpassword)
    {
        alert("Password must be same");
        return false;
    }
    if(gender == "")
    {
        alert("Please select gender");
        return false;
    }
    alert("Registration Successful!");
    document.f1.reset();
    return false;
}
</script>
</body>
</html>
